
user  apim apim;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;



    #HTTP server
    #gitlab
    server {
        listen       10.150.2.109:7091;
        server_name  10.150.2.109;
	client_max_body_size 500m;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_read_timeout  3000;
	proxy_send_timeout  3000;
	send_timeout        3000;

        access_log  /log/nginx/gitlab_http_access.log;
        error_log   /log/nginx/gitlab_http_error.log warn;

	location /api {
		proxy_pass https://gitlab.lotteins.co.kr:17091;
	}
	location ~* \.git(/.*)?$ {
		proxy_pass https://gitlab.lotteins.co.kr:17091;
	}
	location / {
		return 308 https://gitlab.lotteins.co.kr:17091;
	}

    }

    #HTTPS server
    #gitlab    
    server {
        listen       17091 ssl;
        server_name  gitlab.lotteins.co.kr;
	client_max_body_size 500m;
	proxy_request_buffering off;
	proxy_buffering off;
	proxy_read_timeout  3000;
	proxy_send_timeout  3000;
	send_timeout        3000;

        ssl_certificate      /app/nginx/ssl/Wildcard.lotteins.co.kr_pem.pem;
        ssl_certificate_key  /app/nginx/ssl/KeyFile_Wildcard.lotteins.co.kr_pem.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK:!SHA1:!DSS:!DH:!DHE;

	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

        access_log  /log/nginx/gitlab_access.log;
        error_log   /log/nginx/gitlab_error.log warn;

        location / {
	 	proxy_pass http://127.0.0.1:7091;
        }
    }


    #HTTPS server
    #oauth
    server {
        listen       8065 ssl;
        server_name  smp.lotteins.co.kr;

        ssl_certificate      /app/nginx/ssl/Wildcard.lotteins.co.kr_pem.pem;
        ssl_certificate_key  /app/nginx/ssl/KeyFile_Wildcard.lotteins.co.kr_pem.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK:!SHA1:!DSS:!DH:!DHE;

        access_log  /log/nginx/gitlab_oauth_access.log;
        error_log   /log/nginx/gitlab_oauth_error.log warn;

        location / {
                proxy_pass http://10.150.6.23:8065;
        }

    }



    #wiki
    server {
        listen       443 ssl;
        server_name  letwiki.lotteins.co.kr;

        ssl_certificate      /app/nginx/ssl/Wildcard.lotteins.co.kr_pem.pem;
        ssl_certificate_key  /app/nginx/ssl/KeyFile_Wildcard.lotteins.co.kr_pem.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK:!SHA1:!DSS:!DH:!DHE;

        access_log  /log/nginx/wiki_access.log;
        error_log   /log/nginx/wiki_error.log warn;

        location / {
                proxy_pass http://10.150.2.109:8080;
        }
    }

