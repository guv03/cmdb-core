    #earth web
    server {
        listen       8041;
        server_name  earth.lotteins.co.kr;

        access_log  /log/nginx/earth_access.log;
        error_log   /log/nginx/earth_error.log warn;

        location / {
            root   /app/apim/earth/web/earth-frontend-dist;
            index  index.html index.htm;
	    try_files $uri /index.html;
        }
    }

    #prometheus
    server {
        listen       10.150.2.109:9090 ssl;
        server_name  smp.lotteins.co.kr;

        ssl_certificate      /app/nginx/ssl/Wildcard.lotteins.co.kr_pem.pem;
        ssl_certificate_key  /app/nginx/ssl/KeyFile_Wildcard.lotteins.co.kr_pem.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK:!SHA1:!DSS:!DH:!DHE;
	
	allow 10.150.12.0/24;
	allow 127.0.0.1;
	allow 172.17.0.0/16;
	allow 10.150.40.74;
	deny all;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log  /log/nginx/prometheus_access.log;
        error_log   /log/nginx/prometheus_error.log warn;

        location / {
                proxy_pass http://127.0.0.1:9090;
        }
    }

    #grafana
    server {
        listen       10.150.2.109:3000 ssl;
        server_name  smp.lotteins.co.kr;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        ssl_certificate      /app/nginx/ssl/Wildcard.lotteins.co.kr_pem.pem;
        ssl_certificate_key  /app/nginx/ssl/KeyFile_Wildcard.lotteins.co.kr_pem.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCMSHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK:!SHA1:!DSS:!DH:!DHE;

	allow 10.150.12.0/24;
	allow 10.150.40.74;
	deny all;

        access_log  /log/nginx/grafana_access.log;
        error_log   /log/nginx/grafana_error.log warn;

        location / {
                proxy_pass http://127.0.0.1:3000;
        }
    }
	
}
