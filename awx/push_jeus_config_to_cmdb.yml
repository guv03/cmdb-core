---
# AWX Job Template에서 실행하는 플레이북.
# JEUS 7/8/8.5/9(domain.xml 레이아웃 공통, kind=jeus) 도메인 설정 파일(domain.xml)을
# 읽어 CMDB(POST /api/was/)로 push한다. JEUS 6는 파일 구조 자체가 달라(JEUSMain.xml +
# servlet_engine*/WEBMain.xml) 이 플레이북 대상이 아니다(지원 시 별도 플레이북/kind=jeus6).
# 자산 자체는 이 플레이북으로 생성되지 않는다 — push_facts_to_cmdb.yml로 먼저 자산이
# 등록돼 있어야 한다.
#
# 중요: domain.xml 하나가 도메인 전체(여러 물리 노드에 걸친 컨테이너)를 기술할 수 있지만
# 실제로 파일 자체는 admin 서버가 떠있는 호스트에만 있다 — **이 플레이북은 인벤토리에서
# 각 JEUS 도메인의 admin 서버 호스트만 대상으로 실행할 것.** 워커/매니지드 노드를 대상에
# 넣으면 그 호스트엔 domain.xml 사본이 없어 실패하거나(있어도) 같은 도메인을 중복 push하게
# 된다.
#
# hostname은 WebToB(push_webtob_config_to_cmdb.yml)처럼 설정 내용에서 결정적으로 뽑히므로
# (admin-server-name에 해당하는 <server>의 node-name) apache/nginx처럼 별도 hostname
# 필드를 payload에 실을 필요가 없다.
#
# 버전 정보도 WebToB와 달리 명령어 실행이 필요 없다 — domain.xml 루트 엘리먼트의 version
# 속성(예: version="8.5")에 이미 있어서 CMDB가 파싱 시점에 바로 뽑는다
# (webconfig/version_extract.py 같은 마커 방식 불필요, was/parsers.py 참고).
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url      : CMDB 베이스 URL (예: http://cmdb.internal:8000)
#   cmdb_api_key        : was push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   jeus_domain_xml_path : domain.xml 전체 경로(기본값 ${JEUS_HOME}/domains/jeus_domain/config/domain.xml
#                          형태가 흔하지만 실제 설치 경로가 서버마다 다를 수 있어 인벤토리
#                          host_vars로 재정의). 이 값 자체가 CMDB의 config_path(설정 경로)로도
#                          같이 push된다.
#
# 위 변수는 play vars에 기본값을 박아두지 않는다(다른 push_*_config_to_cmdb.yml과 동일 이유
# — play vars가 host_vars보다 우선순위가 높아 host_vars로 재정의를 시도해도 무시되기 때문).

- name: Read JEUS domain.xml and push to CMDB
  hosts: all
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: domain.xml 원본 읽기
      ansible.builtin.slurp:
        src: "{{ jeus_domain_xml_path | default('/app/jeus/domains/jeus_domain/config/domain.xml') }}"
      register: jeus_domain_raw

    - name: CMDB로 WAS 설정 push  # noqa: no-changed-when
      ansible.builtin.uri:
        url: "{{ cmdb_base_url }}/api/was/"
        method: POST
        headers:
          X-API-Key: "{{ cmdb_api_key }}"
        body_format: json
        body:
          kind: jeus
          content: "{{ jeus_domain_raw.content | b64decode }}"
          config_path: "{{ jeus_domain_xml_path | default('/app/jeus/domains/jeus_domain/config/domain.xml') }}"
        status_code: [200, 201]
        validate_certs: "{{ cmdb_validate_certs }}"
      delegate_to: localhost
      no_log: true # 응답/헤더에 X-API-Key가 로그로 남지 않도록
      register: cmdb_push_result

    - name: push 결과 출력
      ansible.builtin.debug:
        msg: "CMDB WAS 설정 push 완료: asset_id={{ cmdb_push_result.json.asset_id }}, hostname={{ cmdb_push_result.json.hostname }}"
