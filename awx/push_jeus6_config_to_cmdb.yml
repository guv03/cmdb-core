---
# AWX Job Template에서 실행하는 플레이북.
# JEUS 6(JEUSMain.xml + 컨테이너별 servlet_engine{N}/WEBMain.xml, kind=jeus6) 설정을
# CMDB(POST /api/was/)로 push한다. JEUS 7/8/8.5/9(domain.xml 레이아웃 공통)는
# push_jeus_config_to_cmdb.yml(kind=jeus) 대상 - 파일 구조 자체가 달라 이 플레이북과
# 공용으로 못 쓴다.
#
# 중요: domain.xml처럼 도메인 전체를 admin 서버 한 대에만 두는 구조가 아니다 - JEUS6은
# admin 서버 개념 자체가 없고 **노드(물리 호스트)마다 자기 자신의 JEUSMain.xml을 따로
# 갖는다.** 그래서 push_jeus_config_to_cmdb.yml과 달리 admin 서버 한 대만 대상으로 하면
# 안 되고, **JEUS6 노드 전부를 인벤토리 대상으로 실행할 것.**
#
# 컨테이너별 웹 커넥션 정보(WebToB 등록, registration-id/network-address/port)는
# JEUSMain.xml이 아니라 servlet_engine{N}/WEBMain.xml에 따로 있고, N은 JEUSMain.xml의
# <engine-container><engine-command><name>engine{N}</engine-command>의 번호와 항상
# 일치한다(컨테이너 이름 번호가 아니라 엔진 이름 번호 기준 - was/parsers.py의 parse_jeus6
# 참고). 이 플레이북은 JEUSMain.xml과 그 밑의 모든 servlet_engine*/WEBMain.xml을 함께
# 읽어 CMDB로 한 번에 push한다 - CMDB는 kind=jeus처럼 content(단일 문자열)가 아니라
# files(파일명 → 원본 텍스트 dict)로 받는다(was/serializers.py 참고).
#
# JEUSMain.xml의 <resource><data-source>는 컨테이너별 참조가 파일에 없어(노드 전체
# 암묵적 공용 리소스) CMDB가 그 노드의 모든 컨테이너에 전부 연결해서 보여준다.
#
# 주의: 같은 물리 호스트에 OS 계정만 다르게 해서 JEUS6가 여러 개 뜰 수 있다(예: ddorap01에
# jeuscm 계정으로 하나, jeuslt 계정으로 또 하나) - JEUSMain.xml의 <node><name>은 물리
# 호스트명이라 계정이 달라도 보통 같은 값이라, 설정 내용만으론 이 두 인스턴스를 구분할 수
# 없다(apache/nginx가 hostname을 payload에 따로 실어 보내는 것과 같은 이유). 그래서
# jeus6_instance_name(보통 이 JEUS6를 띄운 OS 계정명)을 반드시 넣어야 한다 - 같은 호스트를
# 대상으로 이 플레이북을 계정별로 여러 번(인벤토리에 계정별로 별도 host 항목을 만들거나
# Job Template을 계정별로 나눠) 실행할 것.
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url       : CMDB 베이스 URL
#   cmdb_api_key         : was push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   jeus6_config_dir      : JEUSMain.xml과 servlet_engine* 디렉터리가 있는 경로(기본값
#                           /app/jeus6/domains/jeus_domain/config 형태가 흔하지만 실제 설치
#                           경로가 서버마다/계정마다 다를 수 있어 인벤토리 host_vars로 재정의).
#                           파일이 여러 개라 이 디렉터리 값 자체가 CMDB의 config_path(설정
#                           경로)로 그대로 push된다(개별 파일 전체 경로가 아님).
#   jeus6_instance_name    : 이 JEUS6 인스턴스를 구분하는 식별자(보통 OS 계정명, 예: jeuscm) -
#                           **필수**. 계정이 하나뿐이어도 생략하지 말고 채울 것(나중에 두 번째
#                           인스턴스가 생겨도 기존 데이터가 안 흔들리게).
#
# 위 변수는 play vars에 기본값을 박아두지 않는다(다른 push_*_config_to_cmdb.yml과 동일 이유
# — play vars가 host_vars보다 우선순위가 높아 host_vars로 재정의를 시도해도 무시되기 때문).

- name: Read JEUS6 config files and push to CMDB
  hosts: all
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: JEUSMain.xml 원본 읽기
      ansible.builtin.slurp:
        src: "{{ jeus6_config_dir | default('/app/jeus6/domains/jeus_domain/config') }}/JEUSMain.xml"
      register: jeus_main_raw

    - name: servlet_engine*/WEBMain.xml 파일 목록 조회
      ansible.builtin.find:
        paths: "{{ jeus6_config_dir | default('/app/jeus6/domains/jeus_domain/config') }}"
        patterns: "WEBMain.xml"
        recurse: true
      register: webmain_found

    - name: WEBMain.xml 파일별 원본 읽기
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ webmain_found.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: webmain_raw_list

    - name: CMDB payload용 files dict 구성(JEUSMain.xml)
      ansible.builtin.set_fact:
        jeus6_files:
          JEUSMain.xml: "{{ jeus_main_raw.content | b64decode }}"

    - name: CMDB payload용 files dict 구성(WEBMain.xml들 추가)
      # item.item.path는 find로 찾은 원본 경로(예: .../servlet_engine1/WEBMain.xml) -
      # 그 바로 위 디렉터리명(servlet_engine1)만 떼어 "servlet_engine1/WEBMain.xml" 키로 저장.
      ansible.builtin.set_fact:
        jeus6_files: >-
          {{ jeus6_files | combine({
            (item.item.path | dirname | basename) + '/WEBMain.xml': item.content | b64decode
          }) }}
      loop: "{{ webmain_raw_list.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: CMDB로 WAS(JEUS6) 설정 push  # noqa: no-changed-when
      ansible.builtin.uri:
        url: "{{ cmdb_base_url }}/api/was/"
        method: POST
        headers:
          X-API-Key: "{{ cmdb_api_key }}"
        body_format: json
        body:
          kind: jeus6
          files: "{{ jeus6_files }}"
          instance_name: "{{ jeus6_instance_name }}"
          config_path: "{{ jeus6_config_dir | default('/app/jeus6/domains/jeus_domain/config') }}"
        status_code: [200, 201]
        validate_certs: "{{ cmdb_validate_certs }}"
      delegate_to: localhost
      no_log: true # 응답/헤더에 X-API-Key가 로그로 남지 않도록
      register: cmdb_push_result

    - name: push 결과 출력
      ansible.builtin.debug:
        msg: "CMDB WAS(JEUS6) push 완료: asset_id={{ cmdb_push_result.json.asset_id }}, hostname={{ cmdb_push_result.json.hostname }}, instance={{ cmdb_push_result.json.instance_name }}"
