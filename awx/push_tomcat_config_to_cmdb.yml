---
# AWX Job Template에서 실행하는 플레이북.
# Tomcat 설정(server.xml [+ context.xml], kind=tomcat)을 CMDB(POST /api/was/)로 push한다.
# JEUS(push_jeus_config_to_cmdb.yml/push_jeus6_config_to_cmdb.yml)와 완전히 다른 제품이라
# domain.xml 개념이 없고, 대신 파일 여러 개를 files(파일명 → 원본 텍스트 dict)로 보낸다
# (push_jeus6_config_to_cmdb.yml과 동일 패턴).
#
# 중요: server.xml엔 서버 자신을 가리키는 절이 없다(ServerName 개념 자체가 없음) -
# Apache/Nginx(push_apache_config_to_cmdb.yml)와 동일하게 inventory_hostname을 payload에
# 직접 실어 보낸다. context.xml(데이터소스가 있는 $CATALINA_BASE/conf/context.xml)은 없는
# 인스턴스도 있어 선택 사항 - 파일이 없으면 이 태스크가 조용히 건너뛰고 files에서 빠진다.
#
# 같은 물리 호스트에 CATALINA_BASE(설치 경로)만 다르게 해서 Tomcat이 여러 개 뜰 수 있다 -
# 그럴 경우 인벤토리에 인스턴스별로 별도 host 항목을 만들고 tomcat_config_dir을 host_vars로
# 재정의해서 이 플레이북을 인스턴스별로 각각 실행할 것(CMDB의 WasConfigSource.instance_name은
# 아직 Tomcat에서 안 쓰지만, 같은 hostname으로 두 번 push하면 나중 push가 이전 값을 덮어쓰므로
# 실제로 여러 인스턴스가 있는 호스트는 주의).
#
# 버전 정보(solution_version)는 아직 안 채운다 - JEUS처럼 XML 속성에 없어 Apache/Nginx식
# 마커(# CMDB_SOLUTION_VERSION: ...) 작업이 필요한데 아직 안 돼 있음(CLAUDE.md "WAS 설정"의
# "Tomcat" 항목 참고, 필요해지면 push_apache_config_to_cmdb.yml의 catalina.sh version 패턴을
# 그대로 따라 하면 됨).
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url        : CMDB 베이스 URL
#   cmdb_api_key          : was push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   tomcat_config_dir     : server.xml/context.xml이 있는 디렉터리(기본값
#                           /app/tomcat/conf 형태가 흔하지만 실제 설치 경로가 서버마다
#                           다를 수 있어 인벤토리 host_vars로 재정의). 이 값 자체가 CMDB의
#                           config_path(설정 경로)로 그대로 push된다.
#
# 위 변수는 play vars에 기본값을 박아두지 않는다(다른 push_*_config_to_cmdb.yml과 동일 이유
# — play vars가 host_vars보다 우선순위가 높아 host_vars로 재정의를 시도해도 무시되기 때문).

- name: Read Tomcat config files and push to CMDB
  hosts: all
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: server.xml 원본 읽기
      ansible.builtin.slurp:
        src: "{{ tomcat_config_dir | default('/app/tomcat/conf') }}/server.xml"
      register: tomcat_server_raw

    - name: context.xml 존재 확인
      ansible.builtin.stat:
        path: "{{ tomcat_config_dir | default('/app/tomcat/conf') }}/context.xml"
      register: tomcat_context_stat

    - name: context.xml 원본 읽기(있을 때만)
      ansible.builtin.slurp:
        src: "{{ tomcat_config_dir | default('/app/tomcat/conf') }}/context.xml"
      register: tomcat_context_raw
      when: tomcat_context_stat.stat.exists

    - name: CMDB payload용 files dict 구성(server.xml)
      ansible.builtin.set_fact:
        tomcat_files:
          server.xml: "{{ tomcat_server_raw.content | b64decode }}"

    - name: CMDB payload용 files dict 구성(context.xml 추가, 있을 때만)
      ansible.builtin.set_fact:
        tomcat_files: "{{ tomcat_files | combine({'context.xml': tomcat_context_raw.content | b64decode}) }}"
      when: tomcat_context_stat.stat.exists

    - name: CMDB로 WAS(Tomcat) 설정 push  # noqa: no-changed-when
      ansible.builtin.uri:
        url: "{{ cmdb_base_url }}/api/was/"
        method: POST
        headers:
          X-API-Key: "{{ cmdb_api_key }}"
        body_format: json
        body:
          kind: tomcat
          hostname: "{{ inventory_hostname }}"
          files: "{{ tomcat_files }}"
          config_path: "{{ tomcat_config_dir | default('/app/tomcat/conf') }}"
        status_code: [200, 201]
        validate_certs: "{{ cmdb_validate_certs }}"
      delegate_to: localhost
      no_log: true # 응답/헤더에 X-API-Key가 로그로 남지 않도록
      register: cmdb_push_result

    - name: push 결과 출력
      ansible.builtin.debug:
        msg: "CMDB WAS(Tomcat) push 완료: asset_id={{ cmdb_push_result.json.asset_id }}, hostname={{ cmdb_push_result.json.hostname }}"
