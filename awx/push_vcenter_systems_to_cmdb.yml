---
# AWX Job Template에서 실행하는 플레이북. 개별 호스트 facts push(push_facts_to_cmdb.yml)와
# 완전히 분리된 별도 흐름이다 - 호스트 하나당 한 번씩 도는 게 아니라 vCenter 인스턴스
# 하나당 한 번씩, hosts: localhost로 딱 한 번만 실행된다(각 관리 대상 서버에 SSH 접속하지
# 않음).
#
# 왜 이렇게 분리했나: 호스트 facts push 시점엔 그 호스트가 여러 vCenter 중 어디에 속하는지
# 알 수 없다(vCenter가 여러 대인데 호스트별로 미리 매핑해둘 방법이 마땅치 않음). 그래서
# "이 호스트가 어느 vCenter에 있는지" 미리 알아내는 대신, 가진 vCenter를 전부 통째로 조회해
# VM 목록 전체를 CMDB로 보내고, CMDB가 hostname으로 기존 자산(facts push로 이미 등록된)과
# 매칭한다(신규 자산 생성은 안 함 - 자산 생성은 facts push 경로 하나뿐이라는 원칙 유지).
# 자세한 설계는 CMDB 리포지토리 CLAUDE.md의 "시스템" 섹션 참고.
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url      : CMDB 베이스 URL (예: http://cmdb.internal:8000)
#   cmdb_api_key        : systems push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   vcenter_instances   : 리스트. 각 항목은 아래 키를 가진 dict:
#                           name           : vCenter 식별자(예: vcenter01.corp.local) -
#                                            CMDB의 SystemSource.name으로 그대로 쓰임
#                           base_url       : https://vcenter01.corp.local 같은 베이스 URL
#                           username/password : vCenter 인증 정보 - 평문 Extra Variables 대신
#                                            Vault-encrypted 변수나 Survey password 타입 필드로
#                                            주입할 것(AWX Credential의 커스텀 타입으로 만들어
#                                            여러 인스턴스분을 한 번에 주입하는 것도 가능)
#                           validate_certs : 생략 시 true
#
# 주의(반입 전 확인 필요): 아래 guest identity/hardware 관련 응답 필드 경로는 vSphere
# Automation API(vAPI)의 일반적인 구조를 따랐지만, vCenter 버전(6.5/7.0/8.0)마다 스키마가
# 조금씩 다를 수 있다. 실제로 붙이기 전에 https://<vcenter>/apiexplorer에서 실제 응답
# 구조를 확인하고 아래 set_fact의 경로를 맞게 조정할 것 - 이 플레이북은 인증 흐름과 CMDB로
# 보내는 payload 구조(우리 쪽이 확정한 부분)는 그대로 두고 vCenter 응답 파싱 부분만 골라
# 고치면 되도록 한 태스크(VM 상세 정보 조합)에 몰아뒀다.

- name: Collect vCenter VM inventory and push to CMDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: vCenter 인스턴스별로 처리
      ansible.builtin.include_tasks: push_vcenter_systems_instance_tasks.yml
      loop: "{{ vcenter_instances }}"
      loop_control:
        loop_var: vcenter
