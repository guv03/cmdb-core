---
# push_nutanix_systems_to_cmdb.yml에서 Prism Central 인스턴스 하나(loop_var: nutanix)에
# 대해 include_tasks로 호출되는 태스크 목록 - 단독 Job Template으로 실행하지 않는다.
#
# 물리 호스트(AHV 노드) 목록 조회 → VM 목록 조회 → CMDB(POST /api/systems/)로 이 인스턴스
# 하나의 호스트+VM 전체를 배치 push. CMDB 쪽은 "물리 장비가 기본 단위, VM은 그 위에 관계형
# 으로 딸린 OS"로 모델링돼 있어(systems 앱, CLAUDE.md의 "시스템" 섹션 참고) VM 쪽 payload에
# host_external_id로 자신이 속한 호스트를 표시해야 한다.
#
# 호스트/VM 필드명은 실제 Prism Central(v4 API) 응답으로 검증 완료 - 전부 카멜케이스다
# (extId/hostName/powerState, VM의 호스트 참조는 vm.host.extId). 처음엔 스네이크케이스로
# 짐작해 넣었다가(ahv_host.ext_id 등) Jinja가 존재하지 않는 속성을 조용히 Undefined로 넘기고
# default('')가 그걸 삼켜버리는 바람에 모든 host의 external_id/모든 vm의 uuid가 빈 문자열로
# 저장돼 (host, uuid) 조합이 전부 겹치면서 ORA-00001(unique_system_vm_uuid_per_host) push
# 실패로 실제 발견됨 - 반입 전 문서 추정이 아니라 운영 push 실패로 바로잡은 것이므로 필드명을
# 다시 바꿀 땐 반드시 실제 응답으로 재검증할 것. name/uuid(extId)/powerState 외 상세 스펙
# (CPU/메모리/모델 등)은 여전히 구조화하지 않고 원본을 extra에 그대로 보관한다.
#
# 호스트/VM 목록 조회는 둘 다 v4 API의 $page(0-base)/$limit(최대 100) 페이지네이션 대상이다 -
# 파라미터 없이 호출하면 환경 기본값(실측 50건)만 오고 나머지는 조용히 잘린다. 응답
# metadata.totalAvailableResults로 전체 개수를 파악해 남은 페이지를 마저 가져온다(1페이지로
# 충분하면 추가 호출 없음). 호스트는 지금 규모(수십 대)면 1페이지로 끝나지만 나중에 늘어나도
# 안전하도록 VM과 동일한 방식으로 통일해뒀다.

- name: 이 인스턴스의 payload 초기화
  ansible.builtin.set_fact:
    nutanix_hosts_payload: []
    nutanix_vms_payload: []

- name: 인증 헤더 구성(서비스 계정 API 키 우선, 없으면 Basic 인증으로 대체)
  ansible.builtin.set_fact:
    nutanix_auth_headers: "{{ {'X-Ntnx-Api-Key': nutanix.api_key} if nutanix.api_key is defined else {} }}"

- name: 물리 호스트(AHV 노드) 1페이지 조회
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/clustermgmt/v4.0/config/hosts?$page=0&$limit=100"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  register: nutanix_host_page0
  no_log: true

- name: 물리 호스트 나머지 페이지 조회(전체가 100대를 넘을 때만 실행됨)
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/clustermgmt/v4.0/config/hosts?$page={{ item }}&$limit=100"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  loop: "{{ range(1, (((nutanix_host_page0.json.metadata.totalAvailableResults | default(0)) / 100) | round(0, 'ceil') | int)) | list }}"
  register: nutanix_host_pages
  no_log: true

- name: 물리 호스트 전체 페이지 결합
  ansible.builtin.set_fact:
    nutanix_host_list_all: >-
      {{ (nutanix_host_page0.json.data | default([]))
         + (nutanix_host_pages.results | default([]) | map(attribute='json.data') | flatten) }}

- name: 물리 호스트 목록을 CMDB payload 형태로 변환
  # 클러스터/CPU/메모리/모델 등은 CMDB 쪽에 고정 컬럼으로 안 두고 전부
  # SystemHostFieldDefinition(admin 등록, extra 안의 dot-path)으로 뽑으므로 name/external_id
  # 외에는 별도로 안 뽑고 ahv_host 원본 전체를 extra에 실어 보낸다.
  ansible.builtin.set_fact:
    nutanix_hosts_payload: >-
      {{ nutanix_hosts_payload + [{
        'external_id': ahv_host.extId | default(''),
        'name': ahv_host.hostName | default(''),
        'extra': {'host': ahv_host},
      }] }}
  loop: "{{ nutanix_host_list_all }}"
  loop_control:
    loop_var: ahv_host

- name: VM 1페이지 조회
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/vmm/v4.0/ahv/config/vms?$page=0&$limit=100"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  register: nutanix_vm_page0
  no_log: true

- name: VM 나머지 페이지 조회(전체가 100대를 넘을 때만 실행됨)
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/vmm/v4.0/ahv/config/vms?$page={{ item }}&$limit=100"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  loop: "{{ range(1, (((nutanix_vm_page0.json.metadata.totalAvailableResults | default(0)) / 100) | round(0, 'ceil') | int)) | list }}"
  register: nutanix_vm_pages
  no_log: true

- name: VM 전체 페이지 결합
  ansible.builtin.set_fact:
    nutanix_vm_list_all: >-
      {{ (nutanix_vm_page0.json.data | default([]))
         + (nutanix_vm_pages.results | default([]) | map(attribute='json.data') | flatten) }}

- name: VM 목록을 CMDB payload 형태로 변환
  ansible.builtin.set_fact:
    nutanix_vms_payload: >-
      {{ nutanix_vms_payload + [{
        'host_external_id': (vm.host | default({})).extId | default(''),
        'name': vm.name | default(''),
        'hostname': vm.name | default(''),
        'uuid': vm.extId | default(''),
        'power_state': vm.powerState | default(''),
        'extra': {'vm': vm},
      }] }}
  loop: "{{ nutanix_vm_list_all }}"
  loop_control:
    loop_var: vm

- name: CMDB로 시스템 정보 push  # noqa: no-changed-when
  ansible.builtin.uri:
    url: "{{ cmdb_base_url }}/api/systems/"
    method: POST
    headers:
      X-API-Key: "{{ cmdb_api_key }}"
    body_format: json
    body:
      kind: nutanix
      source_name: "{{ nutanix.name }}"
      hosts: "{{ nutanix_hosts_payload }}"
      vms: "{{ nutanix_vms_payload }}"
    status_code: [200, 201]
    validate_certs: "{{ cmdb_validate_certs }}"
  no_log: true
  register: cmdb_push_result

- name: push 결과 출력
  ansible.builtin.debug:
    msg: "CMDB 시스템 push 완료: {{ nutanix.name }}, hosts={{ cmdb_push_result.json.host_count }}, vms={{ cmdb_push_result.json.vm_count }}"
