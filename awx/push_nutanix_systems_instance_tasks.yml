---
# push_nutanix_systems_to_cmdb.yml에서 Prism Central 인스턴스 하나(loop_var: nutanix)에
# 대해 include_tasks로 호출되는 태스크 목록 - 단독 Job Template으로 실행하지 않는다.
#
# 물리 호스트(AHV 노드) 목록 조회 → VM 목록 조회 → CMDB(POST /api/systems/)로 이 인스턴스
# 하나의 호스트+VM 전체를 배치 push. CMDB 쪽은 "물리 장비가 기본 단위, VM은 그 위에 관계형
# 으로 딸린 OS"로 모델링돼 있어(systems 앱, CLAUDE.md의 "시스템" 섹션 참고) VM 쪽 payload에
# host_external_id로 자신이 속한 호스트를 표시해야 한다.
#
# 주의(반입 전 확인 필요): 아래 호스트 목록 엔드포인트 경로(clustermgmt 네임스페이스)와 VM의
# 호스트 참조 필드(vm.host.ext_id)는 Nutanix v4 API의 일반적인 네이밍 관례를 따른 추정이라
# 실제 Prism Central 버전으로 검증 안 됨 - https://developers.nutanix.com/api-reference로
# 확인 후 조정할 것. name/uuid(ext_id)/power_state 외 상세 스펙(CPU/메모리/모델 등)도
# 마찬가지로 구조화하지 않고 원본을 extra에 그대로 보관한다.

- name: 이 인스턴스의 payload 초기화
  ansible.builtin.set_fact:
    nutanix_hosts_payload: []
    nutanix_vms_payload: []

- name: 인증 헤더 구성(서비스 계정 API 키 우선, 없으면 Basic 인증으로 대체)
  ansible.builtin.set_fact:
    nutanix_auth_headers: "{{ {'X-Ntnx-Api-Key': nutanix.api_key} if nutanix.api_key is defined else {} }}"

- name: 물리 호스트(AHV 노드) 목록 조회
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/clustermgmt/v4.0/config/hosts"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  register: nutanix_host_list
  no_log: true

- name: 물리 호스트 목록을 CMDB payload 형태로 변환
  # 클러스터/CPU/메모리/모델 등은 CMDB 쪽에 고정 컬럼으로 안 두고 전부
  # SystemHostFieldDefinition(admin 등록, extra 안의 dot-path)으로 뽑으므로 name/external_id
  # 외에는 별도로 안 뽑고 ahv_host 원본 전체를 extra에 실어 보낸다.
  ansible.builtin.set_fact:
    nutanix_hosts_payload: >-
      {{ nutanix_hosts_payload + [{
        'external_id': ahv_host.ext_id | default(''),
        'name': ahv_host.host_name | default(ahv_host.name | default('')),
        'extra': {'host': ahv_host},
      }] }}
  loop: "{{ nutanix_host_list.json.data | default([]) }}"
  loop_control:
    loop_var: ahv_host

- name: VM 목록 조회
  ansible.builtin.uri:
    url: "{{ nutanix.base_url }}/api/vmm/v4.0/ahv/config/vms"
    method: GET
    headers: "{{ nutanix_auth_headers }}"
    url_username: "{{ nutanix.username | default(omit) }}"
    url_password: "{{ nutanix.password | default(omit) }}"
    force_basic_auth: "{{ nutanix.api_key is not defined }}"
    validate_certs: "{{ nutanix.validate_certs | default(true) }}"
    status_code: [200]
  register: nutanix_vm_list
  no_log: true

- name: VM 목록을 CMDB payload 형태로 변환
  ansible.builtin.set_fact:
    nutanix_vms_payload: >-
      {{ nutanix_vms_payload + [{
        'host_external_id': (vm.host | default({})).ext_id | default(''),
        'name': vm.name | default(''),
        'hostname': vm.name | default(''),
        'uuid': vm.ext_id | default(''),
        'power_state': vm.power_state | default(''),
        'extra': {'vm': vm},
      }] }}
  loop: "{{ nutanix_vm_list.json.data | default([]) }}"
  loop_control:
    loop_var: vm

- name: CMDB로 시스템 정보 push  # noqa: no-changed-when
  ansible.builtin.uri:
    url: "{{ cmdb_base_url }}/api/systems/"
    method: POST
    headers:
      X-API-Key: "{{ cmdb_api_key }}"
    body_format: json
    body:
      kind: nutanix
      source_name: "{{ nutanix.name }}"
      hosts: "{{ nutanix_hosts_payload }}"
      vms: "{{ nutanix_vms_payload }}"
    status_code: [200, 201]
    validate_certs: "{{ cmdb_validate_certs }}"
  no_log: true
  register: cmdb_push_result

- name: push 결과 출력
  ansible.builtin.debug:
    msg: "CMDB 시스템 push 완료: {{ nutanix.name }}, hosts={{ cmdb_push_result.json.host_count }}, vms={{ cmdb_push_result.json.vm_count }}"
