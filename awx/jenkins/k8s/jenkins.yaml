# CMDB 수집용 Jenkins(ansible 내장 이미지)를 K8s에 띄우는 매니페스트.
#   kubectl apply -f jenkins.yaml
# 적용 전에 CHANGE_ME(Harbor 이미지 경로)를 환경에 맞게 바꿀 것(필요하면 nodePort도 고정).
#
# - Jenkins는 여러 개 동시에 띄우는 구조가 아니라 replicas 1 + Recreate(교체 시 기존 Pod를 먼저 내림).
# - jenkins_home(Job/빌드 이력/Credential)은 PVC에 보관 - Pod가 재시작/재배치돼도 유지.
# - 대상 서버 접속은 전부 콜렉터 서버를 경유하므로(Jenkinsfile의 CMDB_COLLECTOR) Pod가 어느 노드에
#   떠도 상관없다. 방화벽은 "K8s 워커 노드들 → 콜렉터 서버 22번"만 열면 됨.
apiVersion: v1
kind: Namespace
metadata:
  name: cmdb-jenkins
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cmdb-jenkins-home
  namespace: cmdb-jenkins
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi   # 내부망 K8s 기존 StorageClass(AWX/Harbor PVC와 동일)
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-jenkins
  namespace: cmdb-jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cmdb-jenkins
  template:
    metadata:
      labels:
        app: cmdb-jenkins
    spec:
      # jenkins 이미지는 uid 1000으로 실행 - PVC 디렉토리 쓰기 권한을 맞춤.
      # NFS(root_squash 등)라 fsGroup이 안 먹어 권한 오류가 나면 NFS 쪽 디렉토리 소유자를 1000으로.
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      # imagePullSecrets:
      #   - name: harbor-pull-secret
      containers:
        - name: jenkins
          image: CHANGE_ME/cmdb-ansible-jenkins:2.580.1-ac2.21.5-r2   # Harbor 경로
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-Xmx1g"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: cmdb-jenkins-home
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-jenkins
  namespace: cmdb-jenkins
spec:
  type: NodePort
  selector:
    app: cmdb-jenkins
  ports:
    - name: http
      port: 8080
      targetPort: http
      # nodePort: 30880   # 고정하고 싶으면 지정(미지정 시 30000-32767 중 자동 할당)
