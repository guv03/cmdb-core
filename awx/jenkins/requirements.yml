# 이미지 빌드 시 설치할 Ansible collection.
# 플레이북 자체는 ansible.builtin만 쓰지만, Windows 호스트 facts 수집엔 ansible.windows가 필요하다.
# 빌드 시점에 범위 안의 최신이 설치되고 이미지 안에 그대로 고정된다(실제 버전은 빌드 로그 마지막 줄 참고).
collections:
  - name: ansible.windows
    version: ">=3.0.0,<4.0.0"
  # dynamic inventory를 쓸 때만 주석 해제(inventory_source_vars.example.yml 참고)
  # - name: community.vmware
  # - name: nutanix.ncp
