---
# AWX Job Template에서 실행하는 플레이북.
# DB 호스트에 SSH 접속해 오라클 OS 계정으로 로컬 sqlplus를 실행하고(OS 인증 - DB
# 비밀번호를 AWX Vault/CMDB 어디에도 저장할 필요 없음), 그 결과(JSON)를
# CMDB(POST /api/database/)로 push한다. 자산 자체는 이 플레이북으로 생성되지 않는다 -
# push_facts_to_cmdb.yml로 먼저 자산이 등록돼 있어야 한다.
#
# 중요(RAC): gv$instance/gv$parameter는 대표 노드 한 곳에서 조회해도 클러스터 전체 인스턴스
# 정보가 나온다(WAS의 domain.xml이 admin 서버 한 곳에서 도메인 전체를 기술하는 것과 같은
# 이유) - **RAC는 인벤토리에 대표 노드 1대만 넣을 것.** 여러 노드를 전부 넣어도 db_unique_name
# 기준으로 같은 소스로 upsert되어 깨지진 않지만(CMDB 쪽 관대한 원칙), 매 노드가 클러스터
# 전체를 중복으로 push하게 되어 비효율적이다. Standalone은 원래 노드가 하나뿐이라 이 문제가
# 없다 - 그래서 이 플레이북은 kind 분기 없이 항상 gv$ 뷰만 조회한다(database/parsers.py 참고).
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url        : CMDB 베이스 URL (예: http://cmdb.internal:8000)
#   cmdb_api_key          : database push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   oracle_home           : ORACLE_HOME 전체 경로 (필수 - 설치 버전/경로가 서버마다 달라 안전한
#                            기본값이 없음. sqlplus 바이너리를 PATH가 아니라 이 경로로 직접
#                            호출하므로 become으로 전환한 셸에서 .bash_profile을 못 읽는 문제와
#                            무관하다 - webtob_path 등과 동일한 이유).
#   oracle_sid            : 이번 실행이 대상으로 할 인스턴스의 ORACLE_SID (필수 - 한 호스트에
#                            SID가 여러 개면 Job Template을 SID별로 따로 실행할 것. RAC는 대표
#                            노드의 로컬 SID 하나만 지정하면 gv$instance가 나머지를 채운다).
#   oracle_unix_account   : sqlplus를 실행할 OS 계정 (기본값 oracle)
#
# 위 변수는 다른 push_*_config_to_cmdb.yml과 동일 이유로 play vars에 기본값을 박아두지 않는다
# (play vars가 host_vars보다 우선순위가 높아 host_vars로 재정의를 시도해도 무시되기 때문).
#
# DB 자체 속성(open_mode/database_role 등)과 인스턴스 목록을 sqlplus가 직접 JSON으로
# 만들어서 출력한다 - Oracle 12c/19c 둘 다 JSON_OBJECT/JSON_ARRAYAGG를 지원해서(대상 버전
# 범위 안에 12c 최초 지원 버전보다 이전은 없음) DB 자신이 CMDB가 기대하는 키 이름
# (snake_case)으로 JSON을 만들어주므로, WebToB처럼 텍스트를 정규식으로 긁어내는 파서가
# CMDB 쪽에 필요 없다(database/parsers.py는 json.loads만 함). JSON_OBJECT 기본 반환 타입은
# VARCHAR2(4000)라 인스턴스가 여러 개인 RAC 등에서 잘릴 수 있어 RETURNING CLOB을 반드시
# 붙인다.
#
# collected_from_instance(SYS_CONTEXT('USERENV','INSTANCE_NAME'))는 WAS의 admin-server-name과
# 같은 역할 - "이번 push를 실제로 실행한 노드가 어디인지"를 CMDB가 instances 목록에서 역으로
# 찾아 DbConfigSource.asset(수집 노드)을 해석한다(database/views.py의
# _extract_collection_hostname). 이 값이 없거나 instances 목록에서 못 찾으면 asset=null로
# 관대하게 처리된다.
#
# listener_port는 local_listener 파라미터(TNS 문자열, 예: (ADDRESS=(PROTOCOL=TCP)(HOST=...)
# (PORT=1521)))에서 정규식으로 포트만 뽑는 best-effort 값이다 - local_listener를 명시적으로
# 설정하지 않고 기본 리스너(1521)만 쓰는 환경에선 비어있을 수 있다. 실제 운영 환경에서 값이
# 안 나오면 이 SQL을 조정해서 재검증할 것(로컬 개발 환경엔 실제 Oracle 인스턴스가 없어
# 합성 payload로만 CMDB 쪽 파싱/저장을 검증했음 - samples/oracle/README.md 참고).

- name: Collect Oracle DB info via local sqlplus and push to CMDB
  hosts: all
  gather_facts: false

  vars:
    cmdb_validate_certs: true
    # RETURNING CLOB이 필요해 SET LONG/LONGCHUNKSIZE도 충분히 크게 잡는다. LINESIZE를 크게
    # 잡아 sqlplus가 JSON 한 줄을 줄바꿈으로 쪼개는 걸 막는다(줄바꿈이 JSON 문자열 값 중간에
    # 끼면 유효하지 않은 JSON이 됨) - WRAP은 기본(ON)을 유지하고 LINESIZE만 키운다(WRAP OFF는
    # 오히려 LINESIZE 초과분을 잘라버려 더 위험).
    oracle_collect_sql: |
      SET PAGESIZE 0
      SET LINESIZE 32767
      SET LONG 100000000
      SET LONGCHUNKSIZE 100000000
      SET TRIMSPOOL ON
      SET FEEDBACK OFF
      SET HEADING OFF
      SET ECHO OFF
      SET VERIFY OFF
      SET TERMOUT ON

      SELECT JSON_OBJECT(
        'db_unique_name' VALUE d.db_unique_name,
        'db_name' VALUE d.name,
        'database_role' VALUE d.database_role,
        'open_mode' VALUE d.open_mode,
        'log_mode' VALUE d.log_mode,
        'platform_name' VALUE d.platform_name,
        'created' VALUE TO_CHAR(d.created, 'YYYY-MM-DD"T"HH24:MI:SS'),
        'characterset' VALUE (SELECT value FROM nls_database_parameters WHERE parameter = 'NLS_CHARACTERSET'),
        'force_logging' VALUE d.force_logging,
        'flashback_on' VALUE d.flashback_on,
        'cdb' VALUE d.cdb,
        'supplemental_log_data_min' VALUE d.supplemental_log_data_min,
        'collected_from_instance' VALUE SYS_CONTEXT('USERENV', 'INSTANCE_NAME'),
        'instances' VALUE (
          SELECT JSON_ARRAYAGG(
            JSON_OBJECT(
              'instance_name' VALUE i.instance_name,
              'instance_number' VALUE i.instance_number,
              'host_name' VALUE i.host_name,
              'version' VALUE i.version,
              'status' VALUE i.status,
              'archiver' VALUE i.archiver,
              'startup_time' VALUE TO_CHAR(i.startup_time, 'YYYY-MM-DD"T"HH24:MI:SS'),
              'listener_port' VALUE (
                SELECT REGEXP_SUBSTR(p.value, 'PORT=([0-9]+)', 1, 1, NULL, 1)
                FROM gv$parameter p
                WHERE p.inst_id = i.inst_id AND p.name = 'local_listener' AND ROWNUM = 1
              )
            )
          )
          FROM gv$instance i
        )
      RETURNING CLOB) AS json_output
      FROM v$database d;

      EXIT;

  tasks:
    - name: sqlplus로 DB 정보 조회
      become: true
      become_user: "{{ oracle_unix_account | default('oracle') }}"
      ansible.builtin.command: "{{ oracle_home }}/bin/sqlplus -s / as sysdba"
      args:
        stdin: "{{ oracle_collect_sql }}"
      environment:
        ORACLE_HOME: "{{ oracle_home }}"
        ORACLE_SID: "{{ oracle_sid }}"
        LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
      register: oracle_collect_result
      changed_when: false

    - name: CMDB로 DB 정보 push  # noqa: no-changed-when
      ansible.builtin.uri:
        url: "{{ cmdb_base_url }}/api/database/"
        method: POST
        headers:
          X-API-Key: "{{ cmdb_api_key }}"
        body_format: json
        body:
          kind: oracle
          content: "{{ oracle_collect_result.stdout | trim }}"
        status_code: [200, 201]
        validate_certs: "{{ cmdb_validate_certs }}"
      delegate_to: localhost
      no_log: true # 응답/헤더에 X-API-Key가 로그로 남지 않도록
      register: cmdb_push_result

    - name: push 결과 출력
      ansible.builtin.debug:
        msg: "CMDB DB 정보 push 완료: db_unique_name={{ cmdb_push_result.json.db_unique_name }}, instance_count={{ cmdb_push_result.json.instance_count }}"
