---
# push_vcenter_systems_to_cmdb.yml에서 vCenter 인스턴스 하나(loop_var: vcenter)에 대해
# include_tasks로 호출되는 태스크 목록 - 단독 Job Template으로 실행하지 않는다.
#
# vSphere Automation API(vAPI) 세션 인증 → 물리 호스트(ESXi) 목록 조회 → 호스트별 VM
# 목록 조회(호스트 매핑용) → VM별 상세/게스트 정보 조회 → CMDB(POST /api/systems/)로 이
# 인스턴스 하나의 호스트+VM 전체를 배치 push하는 순서. CMDB 쪽은 "물리 장비가 기본 단위,
# VM은 그 위에 관계형으로 딸린 OS"로 모델링돼 있어(systems 앱, CLAUDE.md의 "시스템" 섹션
# 참고) VM 쪽 payload에 host_external_id로 자신이 속한 호스트를 표시해야 한다.
#
# **VM이 어느 호스트에 속하는지는 VM 상세 조회(GET /api/vcenter/vm/{vm}) 응답에 없다** -
# 처음엔 이 응답에 host 필드가 있을 거라 짐작하고 넣었지만(vm_detail.json.host) 실측 결과
# VM.Info 구조엔 그런 필드가 없어(cdroms/backing/instant_clone_frozen 등만 있음) 모든 VM이
# host_external_id 빈 문자열로 push되는 버그로 실제 발견됨 - 대신 공식 문서가 안내하는 대로
# 호스트별로 GET /api/vcenter/vm?filter.hosts=<호스트ID>를 호출해 그 호스트에 속한 VM ID
# 목록을 역으로 얻어 vcenter_vm_host_map(vm id → host id)을 만든다.
#
# 구조화해서 뽑는 필드(공식 문서로 확인된 값): VM의 name/power_state/cpu_count/
# memory_size_MiB는 VM 목록 조회(GET /api/vcenter/vm) 응답에 바로 있고, 게스트 hostname/IP는
# GET /api/vcenter/vm/{vm}/guest/identity 응답의 host_name/ip_address에서 온다(VMware
# Tools가 켜져 있어야 나오므로 조회 실패를 무시하고 진행).
#
# 호스트의 CPU 코어 수/메모리 총량/모델 등 실제 하드웨어 스펙은 vCenter 버전마다 정확한
# 응답 경로가 달라 이번 버전에서는 구조화하지 않았다 - host_summary(GET /api/vcenter/host
# 목록 항목) 전체를 extra에 그대로 보관하고, cpu_cores/memory_mb/model은 비워둔다. 실제
# https://<vcenter>/apiexplorer로 GET /api/vcenter/host/{host} 응답을 확인한 뒤 아래
# "물리 호스트 목록을 CMDB payload 형태로 변환" 태스크에 필드를 추가하면 된다.

- name: 이 인스턴스의 payload 초기화
  ansible.builtin.set_fact:
    vcenter_hosts_payload: []
    vcenter_vms_payload: []
    vcenter_vm_host_map: {}

- name: vCenter 세션 인증
  ansible.builtin.uri:
    url: "{{ vcenter.base_url }}/api/session"
    method: POST
    url_username: "{{ vcenter.username }}"
    url_password: "{{ vcenter.password }}"
    force_basic_auth: true
    validate_certs: "{{ vcenter.validate_certs | default(true) }}"
    status_code: [200, 201]
  register: vcenter_session
  no_log: true

- name: 물리 호스트(ESXi) 목록 조회
  ansible.builtin.uri:
    url: "{{ vcenter.base_url }}/api/vcenter/host"
    method: GET
    headers:
      vmware-api-session-id: "{{ vcenter_session.json }}"
    validate_certs: "{{ vcenter.validate_certs | default(true) }}"
    status_code: [200]
  register: vcenter_host_list
  no_log: true

- name: 물리 호스트 목록을 CMDB payload 형태로 변환
  # 클러스터/CPU/메모리/모델/전원 상태 등은 CMDB 쪽에 고정 컬럼으로 안 두고 전부
  # SystemHostFieldDefinition(admin 등록, extra 안의 dot-path)으로 뽑으므로 name/external_id
  # 외에는 별도로 안 뽑고 esxi_host 원본 전체를 extra에 실어 보낸다.
  ansible.builtin.set_fact:
    vcenter_hosts_payload: >-
      {{ vcenter_hosts_payload + [{
        'external_id': esxi_host.host,
        'name': esxi_host.name | default(''),
        'extra': {'host_summary': esxi_host},
      }] }}
  loop: "{{ vcenter_host_list.json }}"
  loop_control:
    loop_var: esxi_host

- name: VM 목록 조회
  ansible.builtin.uri:
    url: "{{ vcenter.base_url }}/api/vcenter/vm"
    method: GET
    headers:
      vmware-api-session-id: "{{ vcenter_session.json }}"
    validate_certs: "{{ vcenter.validate_certs | default(true) }}"
    status_code: [200]
  register: vcenter_vm_list
  no_log: true

- name: 호스트별 VM 목록 조회(호스트 매핑용 - VM 상세 응답엔 소속 호스트 필드가 없어서 역으로 조회)
  # TODO(디버그용 임시조치): no_log를 꺼서 실패 원인(상태 코드/응답 본문)이 그대로 로그에
  # 남게 하고 ignore_errors로 play가 끝까지 가도록 함 - 원인 확인되면 no_log: true 복구하고
  # 이 TODO 주석과 ignore_errors 제거할 것.
  ansible.builtin.uri:
    url: "{{ vcenter.base_url }}/api/vcenter/vm?filter.hosts={{ esxi_host.host }}"
    method: GET
    headers:
      vmware-api-session-id: "{{ vcenter_session.json }}"
    validate_certs: "{{ vcenter.validate_certs | default(true) }}"
    status_code: [200]
  loop: "{{ vcenter_host_list.json }}"
  loop_control:
    loop_var: esxi_host
  register: vcenter_vm_by_host
  ignore_errors: true

- name: VM→호스트 매핑 dict 구성(호스트별 조회 결과를 펼쳐서 누적)
  # 위 태스크의 등록 결과(vcenter_vm_by_host.results)는 호스트 하나당 원소 하나이고, 각
  # 원소의 esxi_host가 그 호스트, json이 그 호스트에 속한 VM 목록이다. subelements로
  # (호스트 결과, VM 하나) 페어로 펼쳐서 vm id -> host id dict를 만든다. set_fact는 block이
  # 아니라 단일 태스크라 loop를 걸어도 문제없다(block+loop 제약과 무관).
  ansible.builtin.set_fact:
    vcenter_vm_host_map: "{{ vcenter_vm_host_map | combine({pair.1.vm: pair.0.esxi_host.host}) }}"
  loop: "{{ query('ansible.builtin.subelements', vcenter_vm_by_host.results, 'json', {'skip_missing': True}) }}"
  loop_control:
    loop_var: pair

- name: VM별 상세/게스트 정보 조회 및 payload 구성
  # VM 하나당 API 호출을 2번(상세/게스트) 묶어야 해서 block+loop을 쓰려 했으나 Ansible은
  # block에 loop를 지원하지 않는다("'loop' is not a valid attribute for a Block") -
  # include_tasks + loop로 대체(push_vcenter_vm_detail_tasks.yml).
  ansible.builtin.include_tasks: push_vcenter_vm_detail_tasks.yml
  loop: "{{ vcenter_vm_list.json }}"
  loop_control:
    loop_var: vm_summary

- name: CMDB로 시스템 정보 push  # noqa: no-changed-when
  ansible.builtin.uri:
    url: "{{ cmdb_base_url }}/api/systems/"
    method: POST
    headers:
      X-API-Key: "{{ cmdb_api_key }}"
    body_format: json
    body:
      kind: vcenter
      source_name: "{{ vcenter.name }}"
      hosts: "{{ vcenter_hosts_payload }}"
      vms: "{{ vcenter_vms_payload }}"
    status_code: [200, 201]
    validate_certs: "{{ cmdb_validate_certs }}"
  no_log: true
  register: cmdb_push_result

- name: push 결과 출력
  ansible.builtin.debug:
    msg: "CMDB 시스템 push 완료: {{ vcenter.name }}, hosts={{ cmdb_push_result.json.host_count }}, vms={{ cmdb_push_result.json.vm_count }}"
