---
# AWX Job Template에서 실행하는 플레이북.
# Apache httpd 설정 파일을 읽어 CMDB(POST /api/webconfig/)로 push한다.
# 자산 자체는 이 플레이북으로 생성되지 않는다 — push_facts_to_cmdb.yml로 먼저 자산이
# 등록돼 있어야 한다.
#
# WebToB(push_webconfig_to_cmdb.yml)와 달리 설정 파일 안에 서버 자신을 가리키는 절이
# 없다(ServerName/ServerAlias는 vhost 도메인일 뿐, 이 서버 자신의 이름이 아님) — 그래서
# hostname은 설정 내용에서 추출하지 않고 push_facts_to_cmdb.yml과 동일하게
# inventory_hostname을 payload에 직접 실어 보낸다.
#
# 버전 정보도 WebToB와 마찬가지로 설정 파일 안에는 없어(httpd.conf/http-ssl.conf 자체에는
# 버전이 안 적힘) apachectl -version으로만 확인 가능. 출력이 "Server version: ..."/
# "Server built: ..." 두 줄인데 CMDB 쪽(webconfig/version_extract.py)은 첫 줄만 버전으로
# 쓰므로 여기서도 stdout_lines[0](첫 줄)만 마커로 얹어 보낸다 - 굳이 build 날짜까지 보낼
# 필요가 없고, 마커를 애초에 한 줄로 만들어두면 "마커 줄과 다음 내용 사이 개행이 깨지는"
# 부류의 문제(push_webconfig_to_cmdb.yml 참고)를 원천적으로 피할 수 있다.
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url       : CMDB 베이스 URL (예: http://cmdb.internal:8000)
#   cmdb_api_key         : webconfig push API 인증 키 (X-API-Key 헤더값). Credential로 주입 권장.
#   apache_config_path  : 파싱 대상 설정 파일 전체 경로(기본값 /etc/httpd/conf.d/httpd-ssl.conf).
#                          서버마다 실제 배치 경로가 다를 수 있어 인벤토리 host_vars로 재정의.
#   apachectl_path       : apachectl 실행파일 전체 경로(기본값 apachectl, PATH에서 탐색).
#
# 위 변수는 play vars에 기본값을 박아두지 않는다(push_webconfig_to_cmdb.yml과 동일 이유 —
# play vars가 host_vars보다 우선순위가 높아 host_vars로 재정의를 시도해도 무시되기 때문).
# 대신 태스크에서 "{{ 변수 | default('기본값') }}" 형태로 사용한다.

- name: Read Apache config and push to CMDB
  hosts: all
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: apache 버전 확인
      ansible.builtin.command: "{{ apachectl_path | default('apachectl') }} -version"
      register: apache_version
      changed_when: false
      failed_when: false # 버전 조회가 실패해도(권한 문제 등) 설정 push 자체는 막히지 않게

    - name: Apache 설정 파일 원본 읽기
      ansible.builtin.slurp:
        src: "{{ apache_config_path | default('/etc/httpd/conf.d/httpd-ssl.conf') }}"
      register: apache_config_raw

    - name: 버전 마커 줄 구성
      # YAML 리터럴 블록(|+)은 이스케이프 해석 없이 실제 줄바꿈을 그대로 보존한다
      # (push_webconfig_to_cmdb.yml에서 겪은 리터럴 "\n" 이스케이프 문제 방지 - 자세한
      # 이유는 그 파일 주석 참고).
      ansible.builtin.set_fact:
        apache_solution_marker: |+
          # CMDB_SOLUTION_VERSION: {{ apache_version.stdout_lines[0] | trim }}

      when: apache_version.rc == 0 and (apache_version.stdout_lines | default([]) | length > 0)

    - name: 버전 조회 실패 시 마커 없이 진행
      ansible.builtin.set_fact:
        apache_solution_marker: ""
      when: not (apache_version.rc == 0 and (apache_version.stdout_lines | default([]) | length > 0))

    - name: 버전 마커를 얹은 push용 내용 구성
      ansible.builtin.set_fact:
        apache_push_content: "{{ apache_solution_marker + (apache_config_raw.content | b64decode) }}"

    - name: CMDB로 웹설정 push  # noqa: no-changed-when
      ansible.builtin.uri:
        url: "{{ cmdb_base_url }}/api/webconfig/"
        method: POST
        headers:
          X-API-Key: "{{ cmdb_api_key }}"
        body_format: json
        body:
          kind: apache
          hostname: "{{ inventory_hostname }}"
          content: "{{ apache_push_content }}"
        status_code: [200, 201]
        validate_certs: "{{ cmdb_validate_certs }}"
      delegate_to: localhost
      no_log: true # 응답/헤더에 X-API-Key가 로그로 남지 않도록
      register: cmdb_push_result

    - name: push 결과 출력
      ansible.builtin.debug:
        msg: "CMDB 웹설정 push 완료: asset_id={{ cmdb_push_result.json.asset_id }}, hostname={{ cmdb_push_result.json.hostname }}"
