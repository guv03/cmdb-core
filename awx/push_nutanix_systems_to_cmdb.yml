---
# AWX Job Template에서 실행하는 플레이북. push_vcenter_systems_to_cmdb.yml과 같은 설계
# 배경 - 개별 호스트 facts push와 분리된 흐름이고, hosts: localhost로 딱 한 번만 실행되며
# 각 관리 대상 서버에 SSH 접속하지 않는다. Nutanix Prism Central을 여러 개 운영할 수 있어
# nutanix_instances 목록으로 순회한다. 자세한 설계는 CMDB 리포지토리 CLAUDE.md의 "시스템"
# 섹션 참고.
#
# 필요한 변수 (AWX Job Template의 Extra Variables / Survey / Credential로 주입):
#   cmdb_base_url      : CMDB 베이스 URL
#   cmdb_api_key        : systems push API 인증 키 (Credential로 주입 권장)
#   nutanix_instances   : 리스트. 각 항목은:
#                           name           : Prism Central 식별자(예: pc01.corp.local) -
#                                            CMDB의 SystemSource.name으로 그대로 쓰임
#                           base_url       : https://pc01.corp.local:9440 (Prism Central
#                                            기본 API 포트 9440)
#                           api_key        : 서비스 계정 API 키(권장, X-Ntnx-Api-Key 헤더로
#                                            사용) - 없으면 username/password로 Basic 인증
#                           username/password : api_key 없을 때만 사용, 평문 대신 Vault-encrypted
#                                            변수나 Survey password 타입 필드로 주입할 것
#                           validate_certs : 생략 시 true
#
# 주의(반입 전 확인 필요): Nutanix v4 API(vmm 네임스페이스)의 VM 응답에서 vCPU/메모리/클러스터/
# IP 필드의 정확한 경로는 Prism Central 버전마다 다를 수 있어 이번 버전에서는 구조화하지
# 않았다 - name/uuid/power_state만 뽑고 나머지는 VM 객체 전체를 extra(참고용 아카이브)에
# 그대로 실어 보낸다. 실제 응답을 https://developers.nutanix.com/api-reference?namespace=vmm
# 또는 실제 호출 결과로 확인한 뒤, push_nutanix_systems_instance_tasks.yml의 set_fact에
# 필드를 추가해 구조화 범위를 넓히면 된다(vCenter 플레이북과 같은 방식).

- name: Collect Nutanix VM inventory and push to CMDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cmdb_validate_certs: true

  tasks:
    - name: Nutanix 인스턴스별로 처리
      ansible.builtin.include_tasks: push_nutanix_systems_instance_tasks.yml
      loop: "{{ nutanix_instances }}"
      loop_control:
        loop_var: nutanix
