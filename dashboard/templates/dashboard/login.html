{% load static %}<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 - CMDB</title>
<link rel="stylesheet" href="{% static 'dashboard/css/bulma.min.css' %}">
<style>
  /* base.html을 extends하지 않는 유일한 화면이라 고대비 테마 오버라이드를 여기 따로 둠(base.html과 동일하게 유지할 것) */
  :root {
    --bulma-family-primary: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, "Segoe UI", Roboto, sans-serif;
    --bulma-body-size: 1.125em;
    --bulma-text-l: 12%;
    --bulma-link-l: 42%;
  }
  .input { border-width: 2px; }
</style>
</head>
<body>
<section class="hero is-fullheight" style="background:#f5f6f8">
  <div class="hero-body">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-4">
          <div class="box">
            <h1 class="title is-5 has-text-centered">CMDB 로그인</h1>
            {% if form.non_field_errors %}
            <div class="notification is-danger is-light">
              {{ form.non_field_errors|join:" " }}
            </div>
            {% endif %}
            <form method="post">
              {% csrf_token %}
              <div class="field">
                <label class="label" for="id_username">아이디</label>
                <div class="control">
                  <input class="input" type="text" name="username" id="id_username" autofocus required>
                </div>
              </div>
              <div class="field">
                <label class="label" for="id_password">비밀번호</label>
                <div class="control">
                  <input class="input" type="password" name="password" id="id_password" required>
                </div>
              </div>
              <input type="hidden" name="next" value="{{ next }}">
              <div class="control">
                <button type="submit" class="button is-link is-fullwidth">로그인</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
